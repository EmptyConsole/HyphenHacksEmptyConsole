<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hestia">
  <!-- Deep-space tile -->
  <rect width="32" height="32" rx="8" fill="#0A0D16"/>

  <!-- Soft constellation glow behind the mark -->
  <circle cx="16" cy="16" r="11" fill="#7B8CFF" opacity="0.12"/>

  <!-- Star body -->
  <path
    d="M16 5 L18.7 12.48 L26.65 12.74 L20.37 17.62 L22.58 25.26 L16 20.8 L9.42 25.26 L11.63 17.62 L5.35 12.74 L13.3 12.48 Z"
    fill="#151B33"
    stroke="#7B8CFF"
    stroke-width="1.35"
    stroke-linejoin="round"
  />

  <!-- Routes between the three villages / stars -->
  <path
    d="M16 7.2 L10.4 23.4 L21.6 23.4 Z"
    fill="none"
    stroke="#F4F5F9"
    stroke-opacity="0.22"
    stroke-width="1.1"
    stroke-linejoin="round"
  />

  <!-- Yellow (accent)  top tip -->
  <circle cx="16" cy="6.2" r="3.35" fill="#FFB547"/>
  <circle cx="15.2" cy="5.4" r="1.05" fill="#FFE2A8" opacity="0.7"/>

  <!-- Red  lower-left tip -->
  <circle cx="9.6" cy="24.4" r="3.35" fill="#FF5C6A"/>
  <circle cx="8.8" cy="23.6" r="1.05" fill="#FFB0B6" opacity="0.7"/>

  <!-- Blue (constellation)  lower-right tip -->
  <circle cx="22.4" cy="24.4" r="3.35" fill="#7B8CFF"/>
  <circle cx="21.6" cy="23.6" r="1.05" fill="#C5CDFF" opacity="0.7"/>
</svg>
